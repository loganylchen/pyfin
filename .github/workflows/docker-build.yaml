name: Docker Build & Push

on:
  push:
  workflow_dispatch:

jobs:
  build-gpu:
    name: GPU Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/pyfin
        tags: |
          type=sha,prefix=gpu-
          type=raw,value=latest-gpu

    - name: Build and push GPU image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.gpu
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=gpu
        cache-to: type=gha,mode=max,scope=gpu

    - name: Smoke test GPU image
      run: |
        docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/pyfin:latest-gpu \
          python3 -c "from fin._dtw import is_available; print('CUDA:', is_available())"

  build-cpu:
    name: CPU Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/pyfin
        tags: |
          type=sha,prefix=cpu-
          type=raw,value=latest

    - name: Build and push CPU image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.cpu
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=cpu
        cache-to: type=gha,mode=max,scope=cpu

    - name: Smoke test CPU image
      run: |
        docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/pyfin:latest \
          python3 -c "from fin._dtw import is_available; print('CUDA:', is_available())"
