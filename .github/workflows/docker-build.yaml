name: Docker images

# Images are published for releases and for main, not for every branch push:
#   tag  v1.2.3  ->  cpu-1.2.3, gpu-1.2.3
#   main         ->  cpu-latest, gpu-latest
# Each image is built, run on the bundled signal fixture, and pushed only if
# that run succeeds.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.flavour }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/pyfin
            ghcr.io/${{ github.repository_owner }}/pyfin
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.flavour }}-
            type=raw,value=${{ matrix.flavour }}-latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.flavour }}
          platforms: linux/amd64
          load: true
          tags: pyfin:candidate
          cache-from: type=gha,scope=${{ matrix.flavour }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavour }}

      - name: Run the image on the bundled signal fixture
        run: |
          docker run --rm pyfin:candidate fin --version
          # no GPU on the runner: the smoke test passes --no-gpu, the same code on the CPU
          docker run --rm \
            -v "$PWD/tests/data/sirv1_mini:/data:ro" \
            -v "$PWD/scripts/smoke_test.sh:/smoke_test.sh:ro" \
            pyfin:candidate sh /smoke_test.sh /data /tmp/out

      - name: Push
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.flavour }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavour }}
