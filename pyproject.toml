[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-fin"
dynamic = ["version"]
description = "A Python package for nanopore Direct RNA-seq data analysis and transcriptome assembly"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "loganylchen", email = "yuelong.chen.btr@gmail.com"},
]
keywords = ["nanopore", "RNA-seq", "bioinformatics", "transcriptomics", "DTW", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    # File I/O handling - format parsers
    "ont-fast5-api>=4.0.0",
    # >=1.0.0: older versions do not accept the pA keyword of
    # Slow5Reader.get_picoamp_signal() and would silently drop every read.
    "pyslow5>=1.0.0",
    "pod5>=0.2.0",
    "pysam>=0.21.0",
    "mappy>=2.24",
    "h5py>=3.0.0",
    # CLI and progress
    "click>=8.0.0",
    "tqdm>=4.62.0",
    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    # Configuration
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov",
    "ruff",
    "build",
]
gpu = [
    # GPU acceleration dependencies
    "cupy>=12.0.0",
    "numba>=0.56.0",
]
all = [
    "py-fin[dev,gpu]",
]

[project.urls]
Homepage = "https://github.com/loganylchen/pyfin"
Repository = "https://github.com/loganylchen/pyfin.git"
Issues = "https://github.com/loganylchen/pyfin/issues"

[project.scripts]
pyfin = "fin.cli:main"
fin = "fin.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fin.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["fin*", "fin.*"]

[tool.setuptools.package-data]
fin = ["*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
]

[tool.ruff]
# Lint the package, the test suites, and benchmarks.
include = [
    "fin/**/*.py",
    "tests/conftest.py",
    "tests/unit/**/*.py",
    "tests/integration/**/*.py",
    "benchmarks/**/*.py",
]
extend-exclude = [
    "**/__pycache__",
]
line-length = 120
